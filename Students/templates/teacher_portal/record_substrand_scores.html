{% load dict_extras %}
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<form id="recordSubStrandScoresForm" method="post" action="{% url 'record_substrand_scores' sub_strand.id sub_strand.strand.grade sub_strand.strand.stream %}">
    {% csrf_token %}

    <div class="row mb-3">
        <div class="col-md-4">
            <label class="form-label">Academic Term</label>
            <select name="term" class="form-select" required>
                <option value="" disabled {% if not selected_term %}selected{% endif %}>Select Term</option>
                {% for t in term_choices %}
                <option value="{{ t }}" {% if selected_term == t %}selected{% endif %}>{{ t }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="col-md-4">
            <label class="form-label">Max Score (Out Of)</label>
            <input type="number"  id="maxScoreInput" class="form-control" placeholder="e.g. 50" min="1">
        </div>
    </div>
    <div class="mb-3 row-md-3">
        <label class="form-label">Assessment Type</label>
        <select name="assessment_type" class="form-select" required>
            <option value="" disabled {% if not selected_assessment_type %}selected{% endif %}>Select Assessment Type</option>
            
            {% for type in assessment_types %}
            <option value="{{ type }}" {% if selected_assessment_type == type %}selected{% endif %}>{{ type }}</option>
            {% endfor %}
        </select>
    </div>

    <div class="table-responsive">
        <table class="table table-striped table-bordered">
            <thead class="table-primary">
                <tr>
                    <th>Student</th>
                    <th>Raw Score</th>
                    <th>Score (%)</th>
                    <th>Level</th>
                    <th>Remark</th>
                </tr>
            </thead>
            <tbody>
                {% for student in students %}
                <tr>
                    <td>{{ student.first_name }} {{ student.surname }}</td>
                    <td>
                        <input type="number" value="{{ raw_scores|get_item:student.registration_no|default:'' }}" name="raw_score_{{ student.registration_no }}" class="form-control raw-score-input" min="0" step="any" placeholder="Raw">
                    </td>
                    <td>
                        <input type="number" name="score_{{ student.registration_no }}" min="0" max="100" step="any"
                            class="form-control" value="{{ scores|get_item:student.registration_no|default:'' }}" readonly style="background-color: #e9ecef;">
                    </td>
                    <td>
                        <select name="level_{{ student.registration_no }}" class="form-select" style="background-color: #e9ecef;width: 100px; pointer-events: none;" tabindex="-1">
                            
                            <option value="" disabled {% if not level_map|get_item:student.registration_no %}selected{% endif %}>Level</option>
                            
                            {% for lvl in levels %}
                            <option 
                                value="{{ forloop.counter }}" 
                                {% if level_map|get_item:student.registration_no == forloop.counter %}selected{% endif %}
                            >
                                {{ lvl }}
                            </option>
                            {% endfor %}
                            
                        </select>
                    </td>
                    <td>
                        <input type="text" name="remark_{{ student.registration_no }}" class="form-control"
                            value="{{ remark|get_item:student.registration_no|default:'' }}">
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>

    <div class="mt-3 d-flex gap-2">
        <button type="submit" class="btn btn-success w-100">Save Scores</button>
        <button type="button" class="btn btn-secondary w-100" data-bs-dismiss="modal">Cancel</button>
    </div>
</form>

{% include "includes/message_modal.html" %}
