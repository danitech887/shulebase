<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<form id="editSubStrandForm" method="post" data-id="{{ ss.id }}">
    {% csrf_token %}
    <div class="mb-3">
        <label class="form-label fw-semibold">Sub-Strand Name</label>
        <input type="text" name="name" value="{{ ss.name }}" class="form-control" required>
    </div>

    <div class="mb-3">
        <label class="form-label fw-semibold">Description</label>
        <textarea name="description" class="form-control" rows="2">{{ ss.description }}</textarea>
    </div>

    <button type="submit" class="btn btn-primary w-100">
        <i class="bi bi-save"></i> Save Changes
    </button>
</form>


{% if messages %}
<div class="modal fade" id="messageModal" tabindex="-1">
    <div class="modal-dialog modal-sm modal-dialog-centered">
        <div class="modal-content p-4 text-center">
            <div class="mb-3" style="width: 80px; height: 80px; background: linear-gradient(135deg, #ef4444, #dc2626); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto;">
                
                <i class="bi bi-info-circle text-white" style="font-size: 2.5rem;"></i>
            </div>
            <p class="text-muted small mb-4">
                {% for msg in messages %}
                 <strong id="res_name" class="text-dark">{{ msg }}</strong>
                {% endfor %}
            </p> 
                <button type="button" class="btn btn-light rounded-pill py-2" data-bs-dismiss="modal">
                    .Ok
                </button>
        </div>
    </div>
</div>

<script>
    document.addEventListener("DOMContentLoaded", function () {
        var modalEl = document.getElementById('messageModal');
        var modal = new bootstrap.Modal(modalEl);
        modal.show();
    });
</script>
{% endif %}

<script>
document.getElementById("editSubStrandForm").addEventListener("submit", async function(e) {
    e.preventDefault();
    const form = this;
    const id = form.dataset.id;
    const formData = new FormData(form);

    try {
        const res = await fetch(`/edit_substrand/${id}/`, {
            method: "POST",
            body: formData,
            headers: { "X-Requested-With": "XMLHttpRequest" },
            credentials: "same-origin"
        });

        const data = await res.json();

        if (data.status === "success") {
            alert("Sub-strand updated successfully!");
            const modal = bootstrap.Modal.getInstance(document.getElementById("editsubStrandModal"));
            modal.hide();
            location.reload();
        } else {
            alert(data.message || "Failed to update sub-strand.");
        }
    } catch (err) {
        console.error("Error updating sub-strand:", err);
        alert("An error occurred. Please try again.");
    }
});
</script>
