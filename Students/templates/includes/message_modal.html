{% if messages %}
<div class="modal fade" id="messageModal" tabindex="-1" aria-labelledby="messageModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-sm modal-dialog-centered">
        <div class="modal-content p-4 text-center" id="messageModalContent">
            <!-- Icon with animation -->
            <div class="mb-3" id="messageIcon" style="width: 80px; height: 80px; background: linear-gradient(135deg, #10b981, #059669); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto; animation: scaleIn 0.5s ease-out;">
                <i class="bi bi-check-circle text-white" style="font-size: 2.5rem;"></i>
            </div>
            
            <!-- Message content -->
            <p class="text-muted small mb-4">
                {% for msg in messages %}
                    <strong id="messageText" class="text-dark">{{ msg }}</strong>
                {% endfor %}
            </p>
            
            <!-- Progress bar and countdown -->
            <div class="mb-3">
                <div style="width: 100%; height: 4px; background: #e5e7eb; border-radius: 2px; overflow: hidden;">
                    <div id="autoCloseProgress" style="height: 100%; background: linear-gradient(90deg, #10b981, #059669); width: 100%; animation: shrink 5s linear forwards;"></div>
                </div>
                <small class="text-muted mt-2 d-block">Closing in <span id="countdown">5</span>s</small>
            </div>
            
            <!-- Close button -->
            <button type="button" class="btn btn-light rounded-pill py-2" data-bs-dismiss="modal">
                Close Now
            </button>
        </div>
    </div>
</div>

<style>
    @keyframes scaleIn {
        from {
            transform: scale(0);
            opacity: 0;
        }
        to {
            transform: scale(1);
            opacity: 1;
        }
    }
    
    @keyframes shrink {
        from {
            width: 100%;
        }
        to {
            width: 0%;
        }
    }
    
    .message-error #messageIcon {
        background: linear-gradient(135deg, #ef4444, #dc2626) !important;
    }
    
    .message-error #autoCloseProgress {
        background: linear-gradient(90deg, #ef4444, #dc2626) !important;
    }
    
    .message-warning #messageIcon {
        background: linear-gradient(135deg, #f59e0b, #d97706) !important;
    }
    
    .message-warning #autoCloseProgress {
        background: linear-gradient(90deg, #f59e0b, #d97706) !important;
    }
    
    .message-info #messageIcon {
        background: linear-gradient(135deg, #3b82f6, #1d4ed8) !important;
    }
    
    .message-info #autoCloseProgress {
        background: linear-gradient(90deg, #3b82f6, #1d4ed8) !important;
    }
</style>

<script>
    document.addEventListener("DOMContentLoaded", function () {
        var modalEl = document.getElementById('messageModal');
        if (!modalEl) return;
        
        var modal = new bootstrap.Modal(modalEl, { backdrop: 'static', keyboard: false });
        
        // Detect message type and apply styling
        var messageText = document.getElementById('messageText');
        var messageContent = document.getElementById('messageModalContent');
        var messageIcon = document.getElementById('messageIcon');
        var messageStr = messageText ? messageText.textContent.toLowerCase() : '';
        
        // Determine message type
        var messageType = 'success'; // default
        var iconClass = 'bi-check-circle';
        
        if (messageStr.includes('error') || messageStr.includes('failed') || messageStr.includes('invalid') || messageStr.includes('does not exist')) {
            messageType = 'error';
            iconClass = 'bi-exclamation-circle';
        } else if (messageStr.includes('warning') || messageStr.includes('caution')) {
            messageType = 'warning';
            iconClass = 'bi-exclamation-triangle';
        } else if (messageStr.includes('info') || messageStr.includes('note')) {
            messageType = 'info';
            iconClass = 'bi-info-circle';
        }
        
        // Apply styling
        messageContent.classList.add('message-' + messageType);
        
        // Update icon
        var iconElement = messageIcon.querySelector('i');
        if (iconElement) {
            iconElement.className = 'bi ' + iconClass + ' text-white';
        }
        
        modal.show();
        
        // Auto-close after 5 seconds
        let countdown = 5;
        const countdownEl = document.getElementById('countdown');
        
        const countdownInterval = setInterval(function() {
            countdown--;
            if (countdownEl) {
                countdownEl.textContent = countdown;
            }
            if (countdown <= 0) {
                clearInterval(countdownInterval);
                modal.hide();
            }
        }, 1000);
        
        // Allow manual close and cleanup
        modalEl.addEventListener('hidden.bs.modal', function() {
            clearInterval(countdownInterval);
        });
    });
</script>
{% endif %}
