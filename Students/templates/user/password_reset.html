<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password</title>

    <!-- Bootstrap CSS (for styling) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5" style="max-width: 500px;">
        <h2 class="text-center mb-4">Reset Password</h2>

        <!-- Show messages -->
        {% if messages %}
<div class="modal fade" id="messageModal" tabindex="-1">
    <div class="modal-dialog modal-sm modal-dialog-centered">
        <div class="modal-content p-4 text-center">
            <div class="mb-3" style="width: 80px; height: 80px; background: linear-gradient(135deg, #ef4444, #dc2626); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto;">
                
                <i class="bi bi-info-circle text-white" style="font-size: 2.5rem;"></i>
            </div>
            <p class="text-muted small mb-4">
                {% for msg in messages %}
                 <strong id="res_name" class="text-dark">{{ msg }}</strong>
                {% endfor %}
            </p> 
                <button type="button" class="btn btn-light rounded-pill py-2" data-bs-dismiss="modal">
                    .Ok
                </button>
        </div>
    </div>
</div>

<script>
    document.addEventListener("DOMContentLoaded", function () {
        var modalEl = document.getElementById('messageModal');
        var modal = new bootstrap.Modal(modalEl);
        modal.show();
    });
</script>
{% endif %}

        {% if request.session.reset_email %}
            <!-- Step 2: Enter Code + New Password -->
            <form method="post">
                {% csrf_token %}
                <input type="hidden" name="step" value="confirm">

                <div class="mb-3">
                    <label for="code" class="form-label">Enter Reset Code</label>
                    <input type="text" class="form-control" id="code" name="code" required>
                </div>

                <div class="mb-3">
                    <label for="new_password" class="form-label">New Password</label>
                    <input type="password" class="form-control" id="new_password" name="new_password" required>
                </div>

                <div class="mb-3">
                    <label for="confirm_password" class="form-label">Confirm Password</label>
                    <input type="password" class="form-control" id="confirm_password" name="confirm_password" required>
                </div>

                <button type="submit" class="btn btn-primary w-100">Reset Password</button>
            </form>
        {% else %}
            <!-- Step 1: Enter Email -->
            <form method="post">
                {% csrf_token %}
                <input type="hidden" name="step" value="email">

                <div class="mb-3">
                    <label for="email" class="form-label">Enter Your Email</label>
                    <input type="email" class="form-control" id="email" name="email" required>
                </div>

                <button type="submit" class="btn btn-primary w-100">Send Reset Code</button>
            </form>
        {% endif %}
    </div>

    <!-- Bootstrap JS (optional, for alerts/buttons) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
