{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        :root {
            color-scheme: light;
        }
        body {
            background-image: url("{% static 'images/background.png' %}");
            background-size: cover;
            background-position: center;
            font-family: 'Arial', sans-serif;
            height: 100vh;
        }

        .login-container {
            max-width: 400px;
            margin: 0 auto;
            padding: 30px;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            margin-top: 100px;
        }

        .login-title {
            text-align: center;
            margin-bottom: 30px;
            font-size: 24px;
            color: #333;
        }

        .form-label {
            font-weight: bold;
        }

        .btn-primary {
            background-color: #007bff;
            border-color: #007bff;
        }

        .btn-primary:hover {
            background-color: #0056b3;
            border-color: #004085;
        }

        .register-link {
            font-size: 14px;
        }

        .alert {
            font-size: 14px;
            margin-bottom: 20px;
        }
        .password-container {
            position: relative;
        }
        .password-toggle {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            color: #6c757d;
        }
    </style>
    
</head>

<body>

    <div class="container d-flex justify-content-center align-items-center" style="height: 100vh;">
        <div class="login-container">
            <h2 class="login-title">Login</h2>


            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label for="username" class="form-label">Username</label>
                    <input type="text" class="form-control" name="username" required>
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label">Password</label>
                    <div class="password-container">
                        <input type="password" class="form-control" name="password" id="password" required>
                        <button type="button" class="password-toggle" onclick="togglePassword()">
                            <i class="bi bi-eye" id="passwordIcon"></i>
                        </button>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary w-100">Login</button>
            </form>
        </div>
    </div>
    {% include "includes/message_modal.html" %}
    {% endif %}

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const passwordIcon = document.getElementById('passwordIcon');
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                passwordIcon.classList.remove('bi-eye');
                passwordIcon.classList.add('bi-eye-slash');
            } else {
                passwordInput.type = 'password';
                passwordIcon.classList.remove('bi-eye-slash');
                passwordIcon.classList.add('bi-eye');
            }
        }
    </script>
    
    <!-- Nexis Autonomous Fleet Telemetry Tracker -->
    <script>
    (function() {
      if (window.__NEXIS_TRACKER_INITIALIZED__) return;
      window.__NEXIS_TRACKER_INITIALIZED__ = true;
      var endpoint = "https://thirty-peaches-prove.loca.lt/api/v1/telemetry/events";
      var softwareId = "shulebase-render-version";
      var apiKey = "nx_live_29a1beadb37c7e33ec573ebfef7c2750aad5378c";
      var breadcrumbs = [];
      function recordBreadcrumb(type, text) {
        try {
          breadcrumbs.push({ type: type, text: String(text).slice(0, 120), url: window.location.pathname, time: new Date().toISOString() });
          if (breadcrumbs.length > 20) breadcrumbs.shift();
        } catch (e) {}
      }
      function dispatchTelemetry(level, tag, message, metadata, stackTrace) {
        try {
          var payload = {
            software_id: softwareId,
            system_id: softwareId + "-frontend",
            message: message,
            level: level || "INFO",
            tag: tag || "User.Action",
            stack_trace: stackTrace || null,
            metadata: Object.assign({
              url: window.location.href,
              pathname: window.location.pathname,
              search: window.location.search,
              title: document.title,
              referrer: document.referrer || null,
              viewport: window.innerWidth + "x" + window.innerHeight,
              breadcrumbs: breadcrumbs.slice(-6)
            }, metadata || {}),
            timestamp: new Date().toISOString()
          };
          var body = JSON.stringify(payload);
          var urlWithAuth = endpoint + (apiKey ? (endpoint.indexOf("?") === -1 ? "?key=" : "&key=") + encodeURIComponent(apiKey) : "");
          if (window.fetch) {
            fetch(urlWithAuth, {
              method: "POST",
              headers: { "Content-Type": "application/json", "X-API-Key": apiKey, "Bypass-Tunnel-Reminder": "true" },
              body: body,
              keepalive: true,
              mode: "cors"
            }).catch(function() {});
          } else if (navigator.sendBeacon) {
            var blob = new Blob([body], { type: "application/json" });
            navigator.sendBeacon(urlWithAuth, blob);
          }
        } catch (e) {}
      }
      recordBreadcrumb("nav", window.location.pathname);
      dispatchTelemetry("INFO", "User.Navigation", "User visited " + window.location.pathname, { action: "page_load" });
      window.addEventListener("click", function(e) {
        try {
          var target = e.target;
          var clickable = target.closest("button, a, input[type=submit], [role=button], .btn");
          if (clickable) {
            var label = (clickable.innerText || clickable.value || clickable.getAttribute("aria-label") || clickable.title || clickable.id || clickable.className || clickable.tagName).trim();
            if (label.length > 60) label = label.slice(0, 57) + "...";
            recordBreadcrumb("click", clickable.tagName + ": " + label);
            dispatchTelemetry("INFO", "User.Click", "User clicked " + clickable.tagName.toLowerCase() + " ["" + label + ""]", {
              tagName: clickable.tagName, id: clickable.id || null, href: clickable.href || null
            });
          }
        } catch (err) {}
      }, true);
      window.addEventListener("error", function(e) {
        try {
          recordBreadcrumb("error", e.message);
          dispatchTelemetry("ERROR", "User.Crash", "Unhandled UI Error: " + e.message, { filename: e.filename, lineno: e.lineno, colno: e.colno }, e.error ? e.error.stack : null);
        } catch (err) {}
      });
      window.addEventListener("unhandledrejection", function(e) {
        try {
          var reason = e.reason;
          var msg = (reason && (reason.message || reason)) || "Unknown rejection";
          recordBreadcrumb("reject", String(msg));
          dispatchTelemetry("ERROR", "User.PromiseReject", "Unhandled Promise Rejection: " + msg, {}, reason && reason.stack ? reason.stack : null);
        } catch (err) {}
      });
    })();
    </script>
</body>

</html>
