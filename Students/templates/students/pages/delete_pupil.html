{% extends 'base.html' %}

{% block title %}Delete Student{% endblock %}
{% block content %}
<style>
    .delete-container {
        padding: 30px;
        border-radius: 10px;
        box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.2);
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 350px;
    }
</style>
<div class="delete-container d-flex justify-content-center align-items-center vh-100 width-60%">
    <div class="card p-4 shadow-lg justify-content-center align-items-center text-center" style="width: 350px;">
        <h2 class="my-4 text-danger">Delete Student</h2>
        <p>Are you sure you want to delete <strong>{{ pupil.first_name }} {{ pupil.surname }}</strong>?</p>
        <form method="post">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">Delete</button>
            <a href="{% url 'manage_details' %}" class="btn btn-secondary">Cancel</a>
        </form>
    </div>
</div>
{% include "includes/message_modal.html" %}
{% endblock %}
