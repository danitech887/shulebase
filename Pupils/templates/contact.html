<section class="py-5 bg-light" id="contact">
  <div class="container">
    <h2 class="section-title" data-aos="fade-up">Contact Us</h2>
    <div class="row">
      <section class="py-5" id="contact">
        <div class="container">
            <h2 class="section-title text-center mb-4" data-aos="zoom-in">Contact Us</h2>

            {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{{ message.tags }}">{{ message }}</div>
            {% endfor %}
            {% endif %}

            <div class="row justify-content-center">
            <div class="col-md-8">
                <form method="post" data-aos="fade-up" class="p-4 shadow-sm bg-white rounded">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn btn-primary w-100">Send Message</button>
                </form>
            </div>
            </div>
        </div>
        </section>

      <div class="col-md-6" data-aos="fade-left">
        <h5>📍 Address</h5>
        <p>Nairobi, Kenya</p>
        <h5>📞 Phone</h5>
        <p>+254 712 345 678</p>
        <h5>✉️ Email</h5>
        <p>support@shulebase.com</p>
      </div>
    </div>
  </div>
</section>
