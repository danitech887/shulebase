<section class="py-5" id="testimonials">
  <div class="container">
    <h2 class="section-title" data-aos="zoom-in">What Schools Say About ShuleBase</h2>

    <div class="row g-4 mb-5">
      {% for t in testimonials %}
        <div class="col-md-4" data-aos="fade-up" data-aos-delay="{{ forloop.counter0|add:"200" }}">
          <div class="testimonial">
            <p>"{{ t.message }}"</p>
            <h6 class="mt-3 mb-0">- {{ t.school_name }}</h6>
          </div>
        </div>
      {% empty %}
        <p class="text-center">No testimonials yet. Be the first to share your experience!</p>
      {% endfor %}
    </div>

    <div class="card p-4 shadow-sm" data-aos="fade-up">
      <h5 class="mb-3">Submit Your Testimonial</h5>
      <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary w-100">Submit</button>
      </form>
    </div>
  </div>
</section>
