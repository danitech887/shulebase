<form id="editSubStrandForm" method="post" data-id="{{ ss.id }}">
    {% csrf_token %}
    <div class="mb-3">
        <label class="form-label fw-semibold">Sub-Strand Name</label>
        <input type="text" name="name" value="{{ ss.name }}" class="form-control" required>
    </div>

    <div class="mb-3">
        <label class="form-label fw-semibold">Description</label>
        <textarea name="description" class="form-control" rows="2">{{ ss.description }}</textarea>
    </div>

    <button type="submit" class="btn btn-primary w-100">
        <i class="bi bi-save"></i> Save Changes
    </button>
</form>

<script>
document.getElementById("editSubStrandForm").addEventListener("submit", async function(e) {
    e.preventDefault();
    const form = this;
    const id = form.dataset.id;
    const formData = new FormData(form);

    try {
        const res = await fetch(`/edit_substrand/${id}/`, {
            method: "POST",
            body: formData,
            headers: { "X-Requested-With": "XMLHttpRequest" },
            credentials: "same-origin"
        });

        const data = await res.json();

        if (data.status === "success") {
            alert("Sub-strand updated successfully!");
            const modal = bootstrap.Modal.getInstance(document.getElementById("editsubStrandModal"));
            modal.hide();
            location.reload();
        } else {
            alert(data.message || "Failed to update sub-strand.");
        }
    } catch (err) {
        console.error("Error updating sub-strand:", err);
        alert("An error occurred. Please try again.");
    }
});
</script>
