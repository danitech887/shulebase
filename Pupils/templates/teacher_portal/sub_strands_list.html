{% load dict_extras %}

<!-- 🟢 Add Sub-Strand Form -->
<form id="addSubStrandForm" method="post" class="mb-4">
    {% csrf_token %}
    <div class="mb-3">
        <label class="form-label fw-semibold">Sub-Strand Name</label>
        <input type="text" name="name" class="form-control" placeholder="Enter sub-strand name" required>
    </div>

    <div class="mb-3">
        <label class="form-label fw-semibold">Description</label>
        <textarea name="description" class="form-control" rows="2" placeholder="Optional description..."></textarea>
    </div>

    <button type="submit" class="btn btn-success w-100">
        <i class="bi bi-plus-circle"></i> Add Sub-Strand
    </button>
</form>

<hr>

<h6 class="fw-bold mb-3">Existing Sub-Strands</h6>

<ul class="list-group" id="subStrandList">
    {% for ss in sub_strands %}
    <li class="list-group-item" id="substrand-item-{{ ss.id }}">
        <!-- 📘 Static display -->
        <div class="substrand-display" id="display-{{ ss.id }}">
            <div class="d-flex justify-content-between align-items-start flex-wrap">
                <div class="flex-grow-1">
                    <span class="fw-semibold"><i class="bi bi-diagram-3 me-1"></i> {{ ss.name }}</span>
                    <small class="text-muted d-block">{{ ss.created_at|date:"M d, Y" }}</small>
                    {% if ss.description %}
                        <p class="text-secondary small mb-1">{{ ss.description }}</p>
                    {% endif %}
                </div>

                <div class="text-end d-flex gap-2">
                    <!-- ✏️ Edit -->
                    <button 
                        type="button"
                        class="btn btn-sm btn-outline-secondary"
                        onclick="toggleEditForm({{ ss.id }})">
                        <i class="bi bi-pencil"></i> Edit
                    </button>

                    <!-- 📘 Record Scores -->
                    <button 
                        type="button"
                        class="btn btn-sm btn-outline-primary"
                        data-substrand="{{ ss.id }}"
                        {% if ss.strand %}
                            data-strand-grade="{{ ss.strand.grade }}"
                            data-strand-stream="{{ ss.strand.stream }}"
                            data-url="{% url 'record_substrand_scores' ss.id ss.strand.grade ss.strand.stream %}"
                        {% endif %}
                        data-bs-toggle="modal"
                        data-bs-target="#recordSubStrandModal">
                        <i class="bi bi-pencil-square"></i> Record Scores
                    </button>
                </div>
            </div>
        </div>

        <!-- ✏️ Inline edit form -->
        <form id="form-{{ ss.id }}" class="substrand-edit-form d-none mt-3 border-top pt-3" data-id="{{ ss.id }}">
            {% csrf_token %}
            <div class="mb-2">
                <label class="small fw-semibold">Sub-Strand Name</label>
                <input type="text" name="name" class="form-control form-control-sm" value="{{ ss.name }}" required>
            </div>
            <div class="mb-2">
                <label class="small fw-semibold">Description</label>
                <textarea name="description" class="form-control form-control-sm" rows="2">{{ ss.description }}</textarea>
            </div>
            <div class="d-flex gap-2">
                <button type="button" class="btn btn-sm btn-primary flex-fill" onclick="saveSubStrand({{ ss.id }})">
                    <i class="bi bi-save"></i> Save
                </button>
                <button type="button" class="btn btn-sm btn-outline-secondary flex-fill" onclick="cancelEdit({{ ss.id }})">
                    <i class="bi bi-x-circle"></i> Cancel
                </button>
            </div>
        </form>
    </li>
    {% empty %}
    <li class="list-group-item text-muted text-center">No sub-strands yet.</li>
    {% endfor %}
</ul>

<script>
async function toggleEditForm(id) {
    document.getElementById(`display-${id}`).classList.add('d-none');
    document.getElementById(`form-${id}`).classList.remove('d-none');
    
}

function cancelEdit(id) {
    document.getElementById(`form-${id}`).classList.add('d-none');
    document.getElementById(`display-${id}`).classList.remove('d-none');
}

async function saveSubStrand(id) {
    const form = document.getElementById(`form-${id}`);
    const btn = form.querySelector('button.btn-primary');
    const csrf = form.querySelector('[name=csrfmiddlewaretoken]').value;
    const formData = new FormData(form);

    btn.disabled = true;
    btn.innerHTML = '<i class="bi bi-arrow-repeat spin"></i> Saving...';

    try {
        const res = await fetch(`/edit_substrand/${id}/`, {
            method: 'POST',
            body: formData,
            headers: { 'X-CSRFToken': csrf },
            credentials: 'same-origin'
        });
        const data = await res.json();

        if (data.status === 'success') {
            // Update the visible display immediately
            const item = document.getElementById(`substrand-item-${id}`);
            item.querySelector('.fw-semibold').innerHTML = `<i class="bi bi-diagram-3 me-1"></i> ${formData.get('name')}`;
            
            const desc = formData.get('description');
            const descEl = item.querySelector('.text-secondary');
            if (descEl) {
                descEl.textContent = desc;
            } else if (desc) {
                const p = document.createElement('p');
                p.className = 'text-secondary small mb-1';
                p.textContent = desc;
                item.querySelector('.flex-grow-1').appendChild(p);
            }

            cancelEdit(id);
        } else {
            alert(data.message || 'Failed to update.');
        }
    } catch (error) {
        console.error(error);
        alert('Error while saving changes.');
    } finally {
        btn.disabled = false;
        btn.innerHTML = '<i class="bi bi-save"></i> Save';
    }
}
</script>
