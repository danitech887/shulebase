{% load dict_extras %}
<form id="recordScoresForm" method="post" action="{{ request.get_full_path }}" novalidate>
    {% csrf_token %}
    <div class="col-md-12 mb-3">
        <label for="term" class="form-label">
            <i class="bi bi-calendar3 me-1"></i>Academic Term
        </label>
        <select name="term" id="term" class="form-select">
            <option value="">Select Term</option>
            {% for t in term_choices %}
                <option value="{{ t }}" {% if t == selected_term %}selected{% endif %}>{{ t }}</option>
            {% endfor %}
        </select>
    </div>

    <div id="scoresFeedback" class="mb-2" style="display:none;"></div>

    <div class="table-responsive">
        <table class="table table-bordered" id="scoresTable">
            <thead>
                <tr>
                    <th>Student</th>
                    <th style="width: 180px;">Score</th>
                </tr>
            </thead>
            <tbody>
                {% for student in students %}
                <tr data-reg="{{ student.registration_no }}">
                    <td>{{ student.first_name }} {{ student.second_name }} {{ student.surname }}</td>
                    <td>
                        <input
                            type="number"
                            name="score_{{ student.registration_no }}"
                            class="form-control"
                            min="0" max="100" step="0.01" inputmode="decimal"
                            placeholder="e.g. 75 or 75.5"
                            value="{{ scores|get_item:student.registration_no|default:'' }}">
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>

    <div class="mt-3 d-flex gap-2">
        <button type="submit" class="btn btn-success w-100" id="saveScoresBtn" formnovalidate>Save Scores</button>
        <button type="button" class="btn btn-secondary w-100" data-bs-dismiss="modal">Cancel</button>
    </div>
</form>

<script>
(function() {
    // Utility: get a cookie by name (for CSRF fallback)
    function getCookie(name) {
        const value = `; ${document.cookie}`;
        const parts = value.split(`; ${name}=`);
        if (parts.length === 2) return parts.pop().split(';').shift();
        return null;
    }

    function showFeedback(form, message, type) {
        const feedbackEl = form.querySelector('#scoresFeedback');
        if (!feedbackEl) return;
        feedbackEl.className = '';
        feedbackEl.classList.add('alert', `alert-${type}`);
        feedbackEl.textContent = message;
        feedbackEl.style.display = 'block';
    }

    function clearRowErrors(form) {
        form.querySelectorAll('#scoresTable tbody tr').forEach(tr => {
            tr.classList.remove('table-danger');
            const small = tr.querySelector('small.text-danger');
            if (small) small.remove();
        });
        const feedbackEl = form.querySelector('#scoresFeedback');
        if (feedbackEl) feedbackEl.style.display = 'none';
    }

    function markRowError(form, regNo, errorMessage) {
        const selector = `#scoresTable tbody tr[data-reg="${(window.CSS && CSS.escape) ? CSS.escape(regNo) : regNo}"]`;
        const row = form.querySelector(selector);
        if (!row) return;
        row.classList.add('table-danger');
        const cell = row.querySelector('td:last-child');
        if (!cell) return;
        const small = document.createElement('small');
        small.className = 'text-danger ms-1';
        small.textContent = errorMessage;
        cell.appendChild(small);
    }

    // When term changes, reload with ?term= for server-side prefill
    document.addEventListener('change', function(e) {
        if (!(e.target && e.target.matches('#recordScoresForm #term'))) return;
        const term = e.target.value;
        const url = new URL(window.location.href);
        if (term) {
            url.searchParams.set('term', term);
        } else {
            url.searchParams.delete('term');
        }
        window.location.href = url.toString();
    });

    document.addEventListener('submit', async function(e) {
        const form = e.target;
        if (!(form && form.id === 'recordScoresForm')) return;

        e.preventDefault();
        clearRowErrors(form);

        const termSelect = form.querySelector('#term');
        const saveBtn = form.querySelector('#saveScoresBtn');
        const term = termSelect ? termSelect.value : '';

        if (!term) {
            showFeedback(form, 'Please select a term before saving.', 'warning');
            return;
        }

        const formData = new FormData(form);
        const csrfToken = (form.querySelector('[name=csrfmiddlewaretoken]') || {}).value || getCookie('csrftoken');
        const actionUrl = form.getAttribute('action') || (window.location.pathname + window.location.search);

        if (saveBtn) {
            saveBtn.disabled = true;
            saveBtn.textContent = 'Saving...';
        }

        try {
            const res = await fetch(actionUrl, {
                method: 'POST',
                headers: Object.assign(
                    {
                        'X-Requested-With': 'XMLHttpRequest',
                        'Accept': 'application/json'
                    },
                    csrfToken ? { 'X-CSRFToken': csrfToken } : {}
                ),
                body: formData,
                credentials: 'same-origin',
                redirect: 'follow'
            });

            // Detect redirects to login or other HTML pages
            const contentType = res.headers.get('content-type') || '';
            const redirectedToLogin = res.redirected && res.url && /login/i.test(res.url);

            if (redirectedToLogin) {
                showFeedback(form, 'Your session has expired. Please log in again.', 'danger');
                return;
            }

            // Prefer JSON; if not JSON, read text and show a concise message
            let data = null;
            if (contentType.includes('application/json')) {
                data = await res.json();
            } else {
                const text = await res.text();
                console.error('Non-JSON response:', text);
                const brief = text.replace(/\s+/g, ' ').slice(0, 200);
                showFeedback(form, `Server returned non-JSON response (status ${res.status}). ${brief}`, 'danger');
                return;
            }

            if (!res.ok) {
                const message = (data && data.message) ? data.message : `Failed to save scores (status ${res.status}).`;
                showFeedback(form, message, 'danger');
                return;
            }

            if (data.status === 'success') {
                showFeedback(form, `Saved ${data.updated} score(s) successfully.`, 'success');
            } else if (data.status === 'partial') {
                showFeedback(form, `Saved ${data.updated} score(s) with some errors.`, 'warning');
                if (Array.isArray(data.errors)) {
                    data.errors.forEach(err => {
                        if (err.registration_no && err.error) {
                            markRowError(form, err.registration_no, err.error);
                        }
                    });
                }
            } else {
                showFeedback(form, 'Unexpected response from server.', 'danger');
            }
        } catch (err) {
            console.error('Fetch error:', err);
            showFeedback(form, 'An error occurred while saving scores.', 'danger');
        } finally {
            if (saveBtn) {
                saveBtn.disabled = false;
                saveBtn.textContent = 'Save Scores';
            }
        }
    });
})();
</script>
