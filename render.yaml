services:
  - type: web
    name: shulebase
    env: python
    buildCommand: |
      pip install -r requirements.txt
      python manage.py collectstatic --noinput
      python manage.py migrate
    startCommand: gunicorn ShuleBase.wsgi:application
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: False
      - key: DATABASE_URL
        fromDatabase:
          name: shulebase_hbsp
          property: connectionString

databases:
  - name: shulebase_hbsp
    plan: free
